name: PropAI Selenium E2E Tests (520 Test Cases)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'selenium-tests/**'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  selenium-e2e:
    name: Selenium E2E – ${{ matrix.browser }} (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        browser: [chrome]
        suite:
          - auth
          - dashboard
          - advanced
          - uiux
          - functional
          - validation
          - deployment
      fail-fast: false

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            selenium-tests/package.json

      # ── 3. Backend ───────────────────────────────────────────────────────────
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install --prefer-offline || npm install

      - name: Start Backend Server
        working-directory: backend
        run: |
          echo "PORT=5000" > .env
          node server.js &
          echo "Waiting for backend to start..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/api/properties && break
            sleep 2
          done
          curl -f http://localhost:5000/api/properties || (echo "❌ Backend failed to start" && exit 1)
          echo "✅ Backend is running"
        env:
          PORT: 5000
          MONGO_URI: ""

      # ── 4. Frontend ──────────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --prefer-offline || npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Serve Frontend (port 5173)
        working-directory: frontend
        run: |
          npx serve -s dist -l 5173 &
          for i in $(seq 1 10); do
            curl -sf http://localhost:5173 && break
            sleep 2
          done
          curl -f http://localhost:5173 || (echo "❌ Frontend failed to start" && exit 1)
          echo "✅ Frontend is running"

      # ── 5. Browser setup ─────────────────────────────────────────────────────
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver (matching version)
        run: |
          CHROME_VERSION=$(google-chrome --version | sed 's/Google Chrome //' | cut -d. -f1)
          echo "Chrome major version: $CHROME_VERSION"
          npm install -g chromedriver@$CHROME_VERSION 2>/dev/null || npm install -g chromedriver
          chromedriver --version

      # ── 6. Test dependencies ──────────────────────────────────────────────────
      - name: Install Selenium Test Dependencies
        working-directory: selenium-tests
        run: npm install

      - name: Create Test .env File
        working-directory: selenium-tests
        run: |
          cat > .env << 'EOF'
          BASE_URL=http://localhost:5173
          BROWSER=chrome
          HEADLESS=true
          IMPLICIT_WAIT=10000
          EXPLICIT_WAIT=30000
          TEST_BUYER_EMAIL=buyer@propai.com
          TEST_BUYER_PASSWORD=password
          TEST_SELLER_EMAIL=seller@propai.com
          TEST_SELLER_PASSWORD=password
          TEST_ADMIN_EMAIL=admin@propai.com
          TEST_ADMIN_PASSWORD=password
          EOF

      - name: Create Report Directories
        working-directory: selenium-tests
        run: mkdir -p reports/screenshots reports/failures reports/logs reports/excel reports/mochawesome

      # ── 7. Run suite ──────────────────────────────────────────────────────────
      - name: Run Selenium Tests – ${{ matrix.suite }}
        working-directory: selenium-tests
        run: npm run test:${{ matrix.suite }}
        continue-on-error: true
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          DISPLAY: ":99"

      # ── 8. Reports ───────────────────────────────────────────────────────────
      - name: Generate Excel Test Report
        working-directory: selenium-tests
        run: |
          node -e "
            require('./utilities/excelReporter')
              .generateReport('CI-${{ matrix.suite }}','${{ matrix.browser }}')
              .then(p => console.log('📊 Excel report:', p))
              .catch(e => console.warn('Report error:', e.message));
          "
        continue-on-error: true

      - name: Merge & Generate HTML Report
        working-directory: selenium-tests
        run: |
          npx mochawesome-merge reports/mochawesome/*.json > reports/mochawesome/merged-${{ matrix.suite }}.json 2>/dev/null || true
          npx marge reports/mochawesome/merged-${{ matrix.suite }}.json \
            -f selenium-report-${{ matrix.suite }} \
            -o reports/mochawesome 2>/dev/null || true
        continue-on-error: true

      # ── 9. Upload artefacts ───────────────────────────────────────────────────
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propai-${{ matrix.suite }}-reports-${{ matrix.browser }}-run${{ github.run_number }}
          path: selenium-tests/reports/
          retention-days: 30

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propai-${{ matrix.suite }}-excel-${{ matrix.browser }}-run${{ github.run_number }}
          path: selenium-tests/reports/excel/
          retention-days: 30

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propai-${{ matrix.suite }}-screenshots-${{ matrix.browser }}-run${{ github.run_number }}
          path: selenium-tests/reports/screenshots/
          retention-days: 14

      # ── 10. Summary ───────────────────────────────────────────────────────────
      - name: Print Run Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════"
          echo "  ✅ PropAI Selenium E2E – Suite Complete"
          echo "  Suite   : ${{ matrix.suite }}"
          echo "  Browser : ${{ matrix.browser }}"
          echo "  Run No  : ${{ github.run_number }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "════════════════════════════════════════════════"
          echo "  Test ranges:"
          echo "    auth         → SE-001 to SE-060"
          echo "    dashboard    → SE-061 to SE-160"
          echo "    advanced     → SE-161 to SE-300"
          echo "    uiux         → SE-301 to SE-360"
          echo "    functional   → SE-361 to SE-440"
          echo "    validation   → SE-441 to SE-500"
          echo "    deployment   → SE-501 to SE-520"
          echo "  TOTAL: 520 unique test cases"
          echo "════════════════════════════════════════════════"

  # ── Merge all suite reports into one final report ────────────────────────────
  merge-reports:
    name: Merge All Suite Reports
    runs-on: ubuntu-latest
    needs: selenium-e2e
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download All Test Reports
        uses: actions/download-artifact@v4
        with:
          pattern: propai-*-reports-chrome-run${{ github.run_number }}
          merge-multiple: true
          path: all-reports

      - name: Final Summary
        if: always()
        run: |
          echo "🏁 PropAI Full E2E Run Complete"
          echo "520 Test Cases across 7 suites executed"
          echo "Check artifacts for detailed Excel + HTML reports"
