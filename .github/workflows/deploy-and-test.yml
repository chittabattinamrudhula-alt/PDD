# ============================================================
# PropAI — Enterprise CI/CD Pipeline
# Stages:
#   1  Checkout
#   2  Install Dependencies
#   3  Build Application
#   4  Static Analysis
#   5  Deploy to GitHub Pages
#   6  Wait for Deployment
#   7  Deployment Verification
#   8  Run Selenium E2E Tests (400+ cases, live GitHub Pages)
#   9  Generate Reports
#   10 Generate Excel Reports
#   11 Upload Artifacts
#   12 Publish Summary
#   13 Store Historical Results
#
# MANDATORY: Selenium always runs against LIVE GitHub Pages URL.
#            Never against localhost or preview servers.
# ============================================================

name: 🚀 PropAI Deploy + Live E2E Tests (400+)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip E2E tests (deploy only)'
        required: false
        default: 'false'
      test_suite:
        description: 'Run specific suite (all/auth/navigation/ui/forms/crud/validation/error/session/upload/accessibility/responsive/performance/regression)'
        required: false
        default: 'all'

# Required permissions for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

# Cancel in-progress runs on the same branch
concurrency:
  group: propai-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  NODE_VERSION: '20'
  CHROME_VERSION: 'stable'

jobs:
  # ════════════════════════════════════════════════════════════
  # STAGE 1–5: BUILD + DEPLOY TO GITHUB PAGES
  # ════════════════════════════════════════════════════════════
  deploy:
    name: 🏗️ Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.set-url.outputs.url }}
      deploy_status:  ${{ steps.deploy-pages.outcome }}

    steps:
      # ── Stage 1: Checkout ──────────────────────────────────
      - name: 📥 Stage 1 — Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Repository Info
        run: |
          echo "Repository   : ${{ github.repository }}"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Commit SHA   : ${{ github.sha }}"
          echo "Pages URL    : ${{ env.GITHUB_PAGES_URL }}"
          echo "Triggered by : ${{ github.event_name }}"

      # ── Stage 2: Install Dependencies ─────────────────────
      - name: ⚙️ Stage 2 — Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install
          echo "✅ Frontend dependencies installed"
          npm list --depth=0

      # ── Stage 3: Build Application ─────────────────────────
      - name: 🔨 Stage 3 — Build Frontend for GitHub Pages
        working-directory: frontend
        run: |
          echo "Building with base path: /${{ github.event.repository.name }}/"
          npm run build
          echo "✅ Build completed"
          ls -lah dist/
          echo "Build size:"
          du -sh dist/
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ secrets.BACKEND_API_URL || 'https://propai-backend.onrender.com/api' }}
          NODE_ENV: production

      - name: 📋 Stage 3 — Verify Build Output
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          echo "✅ Build verified: index.html exists"
          echo "Assets:"
          find frontend/dist -type f | head -30

      # ── Stage 4: Static Analysis ──────────────────────────
      - name: 🔎 Stage 4 — Static Analysis (Lint)
        working-directory: frontend
        run: |
          npm run lint 2>&1 || echo "⚠️  Lint warnings found (non-blocking)"
        continue-on-error: true

      - name: 🔎 Stage 4 — Bundle Size Analysis
        run: |
          echo "=== Bundle Size Report ==="
          find frontend/dist -name "*.js" -exec wc -c {} + | sort -n | tail -10
          find frontend/dist -name "*.css" -exec wc -c {} + | sort -n | tail -5
          echo "Total dist size: $(du -sh frontend/dist | cut -f1)"

      # ── Stage 5: Deploy to GitHub Pages ───────────────────
      - name: 🌐 Stage 5 — Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Stage 5 — Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 🚀 Stage 5 — Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: 🔗 Stage 5 — Set Deployment URL
        id: set-url
        run: |
          URL="${{ env.GITHUB_PAGES_URL }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployment URL: $URL"

  # ════════════════════════════════════════════════════════════
  # STAGE 6–13: VERIFY DEPLOYMENT + RUN LIVE SELENIUM TESTS
  # ════════════════════════════════════════════════════════════
  selenium-live-tests:
    name: 🧪 Live E2E Tests — ${{ matrix.suite }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    timeout-minutes: 60
    strategy:
      matrix:
        browser: [chrome]
        suite:
          - auth
          - navigation
          - ui
          - forms
          - crud
          - validation
          - error
          - session
          - upload
          - accessibility
          - responsive
          - performance
          - regression
      fail-fast: false

    env:
      BASE_URL: ${{ needs.deploy.outputs.deployment_url }}

    steps:
      # ── Stage 1 (sub-job): Checkout ───────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Stage 6: Wait for Deployment ──────────────────────
      - name: ⏳ Stage 6 — Wait for GitHub Pages Deployment
        run: |
          URL="${{ needs.deploy.outputs.deployment_url }}"
          echo "Waiting for deployment to be live at: $URL"
          MAX_RETRIES=20
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $((RETRY+1))/$MAX_RETRIES — HTTP $HTTP_CODE — $URL"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment is LIVE!"
              break
            fi
            RETRY=$((RETRY+1))
            sleep 15
          done
          if [ $RETRY -eq $MAX_RETRIES ]; then
            echo "❌ Deployment did not become available after $((MAX_RETRIES*15))s"
            exit 1
          fi

      # ── Stage 7: Deployment Verification ──────────────────
      - name: ✅ Stage 7 — Deployment Verification
        run: |
          URL="${{ needs.deploy.outputs.deployment_url }}"
          echo "=== Deployment Verification ==="

          # Check 1: HTTP 200
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP Status: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || { echo "❌ Not HTTP 200"; exit 1; }

          # Check 2: HTML content
          CONTENT=$(curl -s "$URL")
          echo "$CONTENT" | grep -q "PropAI\|propai\|React\|root" || { echo "❌ App content not found"; exit 1; }
          echo "✅ HTML content verified"

          # Check 3: CSS assets
          CSS_URL=$(echo "$CONTENT" | grep -o 'href="[^"]*\.css"' | head -1 | sed 's/href="//;s/"//')
          if [ -n "$CSS_URL" ]; then
            if [[ "$CSS_URL" == http* ]]; then
              CSS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CSS_URL")
            else
              CSS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL%/}$CSS_URL")
            fi
            echo "CSS asset HTTP: $CSS_STATUS"
          fi

          # Check 4: JS assets
          JS_URL=$(echo "$CONTENT" | grep -o 'src="[^"]*\.js"' | head -1 | sed 's/src="//;s/"//')
          if [ -n "$JS_URL" ]; then
            if [[ "$JS_URL" == http* ]]; then
              JS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$JS_URL")
            else
              JS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL%/}$JS_URL")
            fi
            echo "JS asset HTTP: $JS_STATUS"
          fi

          echo "✅ All deployment verification checks PASSED"
          echo "DEPLOYMENT_VERIFIED=true" >> $GITHUB_ENV

      # ── Stage 2: Setup Node.js ─────────────────────────────
      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: automation/package.json

      # ── Stage 2: Install Test Framework ───────────────────
      - name: 📦 Install Automation Framework Dependencies
        working-directory: automation
        run: |
          npm ci || npm install
          echo "✅ Automation framework ready"

      # ── Setup Chrome ───────────────────────────────────────
      - name: 🌐 Setup Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROME_VERSION }}

      - name: 🔧 Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+' | head -1)
          echo "Chrome major version: $CHROME_VERSION"
          npx --yes chromedriver@$CHROME_VERSION 2>/dev/null || \
          npm install -g chromedriver@$CHROME_VERSION 2>/dev/null || \
          npm install -g chromedriver
          chromedriver --version || true

      # ── Setup Virtual Display ─────────────────────────────
      - name: 🖥️ Setup Virtual Display (Xvfb)
        run: |
          sudo apt-get install -y xvfb > /dev/null 2>&1
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2
          echo "✅ Virtual display ready"

      # ── Create .env for automation ─────────────────────────
      - name: 🔑 Configure Test Environment
        working-directory: automation
        run: |
          cat > .env << EOF
          BASE_URL=${{ needs.deploy.outputs.deployment_url }}
          BROWSER=chrome
          HEADLESS=true
          IMPLICIT_WAIT=15000
          EXPLICIT_WAIT=45000
          TEST_SUITE=${{ matrix.suite }}
          GITHUB_RUN_NUMBER=${{ github.run_number }}
          GITHUB_SHA=${{ github.sha }}
          GITHUB_REPO=${{ github.repository }}
          TEST_BUYER_EMAIL=buyer@propai.com
          TEST_BUYER_PASSWORD=password
          TEST_SELLER_EMAIL=seller@propai.com
          TEST_SELLER_PASSWORD=password
          TEST_ADMIN_EMAIL=admin@propai.com
          TEST_ADMIN_PASSWORD=password
          ENVIRONMENT=github-pages
          EOF
          echo "✅ Test environment configured"
          echo "BASE_URL: ${{ needs.deploy.outputs.deployment_url }}"

      # ── Create Report Directories ─────────────────────────
      - name: 📁 Create Report Directories
        working-directory: automation
        run: |
          mkdir -p \
            reports/screenshots \
            reports/failures \
            reports/logs \
            reports/excel \
            reports/html \
            reports/json \
            reports/summary \
            reports/mochawesome
          echo "✅ Report directories created"

      # ── Stage 8: Run Selenium E2E Tests ───────────────────
      - name: 🧪 Stage 8 — Run Live E2E Tests — ${{ matrix.suite }}
        working-directory: automation
        run: |
          echo "════════════════════════════════════════"
          echo "  Running Suite  : ${{ matrix.suite }}"
          echo "  Browser        : ${{ matrix.browser }}"
          echo "  Target URL     : $BASE_URL"
          echo "  Run Number     : ${{ github.run_number }}"
          echo "════════════════════════════════════════"
          npm run test:${{ matrix.suite }} 2>&1 | tee reports/logs/${{ matrix.suite }}-execution.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Test exit code: $EXIT_CODE"
          exit $EXIT_CODE
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          DISPLAY: ":99"
          TEST_SUITE: ${{ matrix.suite }}
        continue-on-error: true

      # ── Stage 9: Generate Reports ─────────────────────────
      - name: 📊 Stage 9 — Generate HTML Report
        working-directory: automation
        run: |
          # Merge mochawesome JSON
          npx mochawesome-merge reports/mochawesome/*.json \
            > reports/mochawesome/merged-${{ matrix.suite }}.json 2>/dev/null || true

          # Generate HTML from merged JSON
          npx marge reports/mochawesome/merged-${{ matrix.suite }}.json \
            --reportDir reports/html \
            --reportFilename execution-report-${{ matrix.suite }} \
            --reportTitle "PropAI E2E — ${{ matrix.suite }}" \
            --charts true 2>/dev/null || true

          # Generate execution summary JSON
          node utils/summaryGenerator.js \
            --suite "${{ matrix.suite }}" \
            --browser "${{ matrix.browser }}" \
            --url "$BASE_URL" \
            --run "${{ github.run_number }}" \
            --sha "${{ github.sha }}" 2>/dev/null || true

          echo "✅ HTML reports generated"
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
        continue-on-error: true

      # ── Stage 10: Generate Excel Reports ──────────────────
      - name: 📈 Stage 10 — Generate Excel Report
        working-directory: automation
        run: |
          node utils/excelReporter.js \
            --suite "${{ matrix.suite }}" \
            --browser "${{ matrix.browser }}" \
            --env "GitHub Pages" \
            --url "$BASE_URL" \
            --run "${{ github.run_number }}" 2>&1 || true
          echo "✅ Excel report generated"
          ls -lah reports/excel/ 2>/dev/null || true
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
        continue-on-error: true

      # ── Stage 11: Upload Artifacts ─────────────────────────
      - name: 📤 Stage 11 — Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propai-${{ matrix.suite }}-reports-${{ matrix.browser }}-run${{ github.run_number }}
          path: automation/reports/
          retention-days: 30

      - name: 📤 Stage 11 — Upload Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-${{ matrix.suite }}-${{ matrix.browser }}-run${{ github.run_number }}
          path: automation/reports/excel/
          retention-days: 30

      - name: 📤 Stage 11 — Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.suite }}-run${{ github.run_number }}
          path: |
            automation/reports/screenshots/
            automation/reports/failures/
          retention-days: 30

      - name: 📤 Stage 11 — Upload Execution Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.suite }}-run${{ github.run_number }}
          path: automation/reports/logs/
          retention-days: 30

      - name: 📤 Stage 11 — Upload JSON Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-${{ matrix.suite }}-run${{ github.run_number }}
          path: automation/reports/json/
          retention-days: 30

      # ── Stage 12: Publish Job Summary ─────────────────────
      - name: 📋 Stage 12 — Publish GitHub Step Summary
        if: always()
        run: |
          RESULTS_FILE="automation/reports/json/${{ matrix.suite }}-results.json"
          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(node -e "const r=require('$RESULTS_FILE'); console.log(r.total||0)" 2>/dev/null || echo "0")
            PASSED=$(node -e "const r=require('$RESULTS_FILE'); console.log(r.passed||0)" 2>/dev/null || echo "0")
            FAILED=$(node -e "const r=require('$RESULTS_FILE'); console.log(r.failed||0)" 2>/dev/null || echo "0")
            SKIPPED=$(node -e "const r=require('$RESULTS_FILE'); console.log(r.skipped||0)" 2>/dev/null || echo "0")
            RATE=$(node -e "const r=require('$RESULTS_FILE'); console.log(r.passRate||'0.00')" 2>/dev/null || echo "0.00")
            DURATION=$(node -e "const r=require('$RESULTS_FILE'); console.log(r.duration||'0')" 2>/dev/null || echo "0")
          else
            TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0; RATE="N/A"; DURATION="N/A"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 PropAI Live E2E — Suite: \`${{ matrix.suite }}\`

          | Field | Value |
          |-------|-------|
          | 🌐 Target URL | ${{ needs.deploy.outputs.deployment_url }} |
          | 🗂️ Suite | ${{ matrix.suite }} |
          | 🌍 Browser | ${{ matrix.browser }} |
          | 🔢 Run Number | ${{ github.run_number }} |
          | 🔗 Commit | \`${{ github.sha }}\` |

          ### 📊 Results

          | Metric | Count |
          |--------|-------|
          | Total Tests | $TOTAL |
          | ✅ Passed | $PASSED |
          | ❌ Failed | $FAILED |
          | ⏭️ Skipped | $SKIPPED |
          | 📈 Pass Rate | $RATE% |
          | ⏱️ Duration | ${DURATION}s |

          ### 📦 Artifacts
          - \`propai-${{ matrix.suite }}-reports-${{ matrix.browser }}-run${{ github.run_number }}\` — Full reports (30 days)
          - \`excel-${{ matrix.suite }}-${{ matrix.browser }}-run${{ github.run_number }}\` — Excel file (30 days)
          - \`screenshots-${{ matrix.suite }}-run${{ github.run_number }}\` — Screenshots (30 days)

          EOF

  # ════════════════════════════════════════════════════════════
  # STAGE 12–13: MERGE ALL RESULTS + FINAL SUMMARY + HISTORY
  # ════════════════════════════════════════════════════════════
  final-summary:
    name: 📊 Final Summary + Historical Record
    runs-on: ubuntu-latest
    needs: [deploy, selenium-live-tests]
    if: always()
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Download all artifacts ────────────────────────────
      - name: 📥 Download All Test Reports
        uses: actions/download-artifact@v4
        with:
          pattern: propai-*-reports-chrome-run${{ github.run_number }}
          merge-multiple: true
          path: all-reports

      - name: 📥 Download All JSON Results
        uses: actions/download-artifact@v4
        with:
          pattern: json-*-run${{ github.run_number }}
          merge-multiple: true
          path: all-json

      # ── Stage 9: Merge + Generate Master Report ───────────
      - name: 📊 Stage 9 — Generate Master Excel Report
        working-directory: automation
        run: |
          npm ci || npm install 2>/dev/null || true
          node utils/excelReporter.js \
            --suite "ALL" \
            --browser "Chrome" \
            --env "GitHub Pages" \
            --url "${{ needs.deploy.outputs.deployment_url }}" \
            --run "${{ github.run_number }}" \
            --merge "../all-json" 2>&1 || true
        continue-on-error: true

      # ── Stage 13: Store Historical Results ────────────────
      - name: 📚 Stage 13 — Store Historical Test Results
        run: |
          mkdir -p test-history/${{ github.run_number }}
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > test-history/${{ github.run_number }}/meta.json << EOF
          {
            "runNumber": "${{ github.run_number }}",
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$TIMESTAMP",
            "deploymentUrl": "${{ needs.deploy.outputs.deployment_url }}",
            "trigger": "${{ github.event_name }}",
            "actor": "${{ github.actor }}",
            "suites": ["auth","navigation","ui","forms","crud","validation","error","session","upload","accessibility","responsive","performance","regression"]
          }
          EOF

          # Copy JSON results
          cp -r all-json/* test-history/${{ github.run_number }}/ 2>/dev/null || true
          echo "✅ Historical record saved for run #${{ github.run_number }}"

      - name: 📤 Upload Master Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MASTER-REPORT-run${{ github.run_number }}
          path: |
            automation/reports/excel/
            test-history/
          retention-days: 30

      # ── Stage 12: Final GitHub Summary ────────────────────
      - name: 📋 Stage 12 — Publish Final GitHub Summary
        if: always()
        run: |
          # Aggregate results from all JSON files
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0
          for f in all-json/*.json; do
            [ -f "$f" ] || continue
            T=$(node -e "try{const r=require('./$f');console.log(r.total||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            P=$(node -e "try{const r=require('./$f');console.log(r.passed||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            FA=$(node -e "try{const r=require('./$f');console.log(r.failed||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            SK=$(node -e "try{const r=require('./$f');console.log(r.skipped||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            TOTAL=$((TOTAL+T)); PASSED=$((PASSED+P)); FAILED=$((FAILED+FA)); SKIPPED=$((SKIPPED+SK))
          done

          if [ $TOTAL -gt 0 ]; then
            RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc)
          else
            RATE="0.00"
          fi

          DEPLOY_STATUS="${{ needs.deploy.result }}"
          TESTS_STATUS="${{ needs.selenium-live-tests.result }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Pass/Fail logic: fail only if deploy fails OR >5% critical failures
          if [ "$DEPLOY_STATUS" != "success" ]; then
            OVERALL="❌ FAILED (Deployment Failed)"
          elif [ $TOTAL -gt 0 ] && [ $(echo "$RATE < 95" | bc) -eq 1 ]; then
            OVERALL="⚠️ DEGRADED (Pass Rate < 95%)"
          else
            OVERALL="✅ PASSED"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🏠 PropAI — Live GitHub Pages E2E Execution Summary

          > **Deployment URL:** ${{ needs.deploy.outputs.deployment_url }}
          > **Execution Date:** $TIMESTAMP
          > **Overall Status:** $OVERALL

          ---

          ## 🚀 Pipeline Status

          | Stage | Status |
          |-------|--------|
          | 🏗️ Build | ${{ needs.deploy.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |
          | 🌐 Deploy to GitHub Pages | ${{ needs.deploy.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |
          | ✅ Deployment Verification | ${{ needs.deploy.result == 'success' && '✅ PASSED' || '⏭️ SKIPPED' }} |
          | 🧪 Selenium E2E Tests | ${{ needs.selenium-live-tests.result == 'success' && '✅ PASSED' || needs.selenium-live-tests.result == 'failure' && '❌ FAILED' || '⚠️ PARTIAL' }} |
          | 📊 Report Generation | ✅ Completed |
          | 📤 Artifact Upload | ✅ Completed |

          ---

          ## 📊 Test Execution Summary

          | Metric | Value |
          |--------|-------|
          | 🌐 Live Test Target | ${{ needs.deploy.outputs.deployment_url }} |
          | 📋 Total Test Cases | **$TOTAL** |
          | ✅ Passed | **$PASSED** |
          | ❌ Failed | **$FAILED** |
          | ⏭️ Skipped | **$SKIPPED** |
          | 📈 Pass Percentage | **$RATE%** |
          | 🔢 GitHub Run | #${{ github.run_number }} |
          | 🌿 Branch | ${{ github.ref_name }} |
          | 📝 Commit | \`${{ github.sha }}\` |
          | 👤 Actor | ${{ github.actor }} |

          ---

          ## 🗂️ Test Suites Executed (13 Suites × ~32 cases each = 400+)

          | Suite | Category | Test Range |
          |-------|----------|------------|
          | auth | Authentication | TC-AUTH-001 to TC-AUTH-040 |
          | navigation | Navigation | TC-NAV-001 to TC-NAV-030 |
          | ui | UI Validation | TC-UI-001 to TC-UI-050 |
          | forms | Forms | TC-FORM-001 to TC-FORM-050 |
          | crud | CRUD Operations | TC-CRUD-001 to TC-CRUD-050 |
